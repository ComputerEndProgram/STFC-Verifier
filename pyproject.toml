[project]
name = "verifier"
version = "0.1.0"
description = "Discord verifier bot with profile-driven behavior."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py",
  "python-dotenv",
  "beautifulsoup4",
  "requests",
  "opencv-python-headless",
  "numpy",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
verifier = "bot.main:main"
verifier-admin-web = "admin_web.__main__:main"

[tool.setuptools.packages.find]
include = ["bot*", "admin_web*"]

[tool.setuptools.package-data]
"bot.i18n" = ["*.json"]
"admin_web" = ["static/*.css", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
